version: '3.8'

services:
  db:
    image: ankane/pgvector:latest
    container_name: hackathon_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: submissions_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: hackathon_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: